<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도윤의 축구 앱</title>
<meta name="description" content="포메이션 메이커와 오늘만 축구 선수였다면 카드 생성기">
<meta name="theme-color" content="#0e1511">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1511; --surface:#16201a; --ink:#e7efe9; --muted:#9aab9f; --line:#2b3a30; --accent:#7ee08a;
  --display:"Black Han Sans",sans-serif; --body:"IBM Plex Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;word-break:keep-all;
  background-image:radial-gradient(circle at 50% -20%,#1f3a26 0,transparent 60%)}
main{max-width:560px;margin:0 auto;padding:56px 16px 40px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,48px);line-height:1.1;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 32px}
a.app{display:flex;gap:16px;align-items:center;padding:20px;margin-bottom:14px;border:1px solid var(--line);border-radius:18px;
  background:var(--surface);color:inherit;text-decoration:none;transition:transform .15s ease,border-color .15s ease}
a.app:hover,a.app:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.icon{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:#0b110d;border:1px solid var(--line)}
.app h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 2px}
.app p{margin:0;color:var(--muted);font-size:14px}
.arrow{margin-left:auto;color:var(--accent);font-size:22px}
footer{margin-top:36px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>도윤의 축구 앱</h1>
  <p class="lead">만들고 싶은 걸 골라 보세요.</p>

  <a class="app" href="/card">
    <span class="icon" aria-hidden="true">🃏</span>
    <span><h2>오늘만 축구 선수였다면</h2><p>내 얼굴로 프로급 축구 선수 카드 만들기</p></span>
    <span class="arrow" aria-hidden="true">→</span>
  </a>

  <a class="app" href="/formation">
    <span class="icon" aria-hidden="true">⚽</span>
    <span><h2>포메이션 메이커</h2><p>우리 팀 선발 라인업 카드 만들기</p></span>
    <span class="arrow" aria-hidden="true">→</span>
  </a>

  <footer>made by 도윤</footer>
</main>
</body>
</html>
